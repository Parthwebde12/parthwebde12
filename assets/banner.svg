<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Parth Wakodikar - Generative AI, Backend and Full Stack Engineer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#background)" rx="12"/>
  <rect width="1200" height="4" fill="url(#accent)" rx="2"/>

  <circle cx="80" cy="82" r="7" fill="#3fb950"/>
  <text x="100" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#3fb950">
    Looking for an internship
  </text>
  <circle cx="390" cy="82" r="5" fill="#8b949e"/>
  <text x="406" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">
    Pune, India
  </text>

  <!-- PW monogram -->
  <g transform="translate(1008 52)">
    <rect width="128" height="128" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <text x="64" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-4" fill="#ffffff">
      PW
    </text>
  </g>

  <text x="80" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Parth Wakodikar
  </text>
  <text x="82" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9db4ff">
    Generative AI · Backend · Full Stack
  </text>

  <g transform="translate(82 248)">
    <!-- Python -->
    <rect width="64" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="27" cy="27" r="11" fill="#3776ab"/>
    <circle cx="37" cy="37" r="11" fill="#ffd43b"/>
    <circle cx="24" cy="24" r="2" fill="#ffffff"/>
    <circle cx="40" cy="40" r="2" fill="#ffffff"/>

    <!-- TypeScript -->
    <g transform="translate(76 0)">
      <rect width="64" height="64" rx="14" fill="#3178c6"/>
      <text x="32" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">TS</text>
    </g>

    <!-- React -->
    <g transform="translate(152 0)">
      <rect width="64" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="3"/>
      <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(60 32 32)"/>
      <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(120 32 32)"/>
      <circle cx="32" cy="32" r="4" fill="#61dafb"/>
    </g>

    <!-- Next.js -->
    <g transform="translate(228 0)">
      <rect width="64" height="64" rx="14" fill="#050505" stroke="#30363d"/>
      <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M22 44V20L43 44V20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Node.js -->
    <g transform="translate(304 0)">
      <rect width="64" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <path d="M32 8L51 19V41L32 52L13 41V19Z" fill="none" stroke="#83cd29" stroke-width="3"/>
      <text x="32" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#83cd29">JS</text>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(380 0)">
      <rect width="64" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <ellipse cx="32" cy="26" rx="18" ry="10" fill="#336791"/>
      <path d="M14 26V42C14 49 22 54 32 54C42 54 50 49 50 42V26" fill="#336791"/>
      <ellipse cx="32" cy="42" rx="18" ry="10" fill="#336791"/>
      <circle cx="25" cy="25" r="2" fill="#ffffff"/>
      <circle cx="39" cy="25" r="2" fill="#ffffff"/>
    </g>

    <!-- RAG -->
    <g transform="translate(456 0)">
      <rect width="64" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <line x1="20" y1="18" x2="44" y2="32" stroke="#9db4ff" stroke-width="3"/>
      <line x1="20" y1="46" x2="44" y2="32" stroke="#9db4ff" stroke-width="3"/>
      <circle cx="20" cy="18" r="6" fill="#6C63FF"/>
      <circle cx="20" cy="46" r="6" fill="#00D9FF"/>
      <circle cx="44" cy="32" r="7" fill="#ffffff"/>
      <circle cx="44" cy="32" r="3" fill="#161b22"/>
    </g>
  </g>

  <line x1="82" y1="326" x2="1118" y2="326" stroke="#30363d"/>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#8b949e">
    "Build quietly. Ship boldly. Keep learning."
  </text>
