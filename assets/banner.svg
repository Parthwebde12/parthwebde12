<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Parth Wakodikar - Generative AI, Backend and Full Stack Engineer, looking for an internship" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- status -->
  <rect x="60" y="34" width="292" height="36" rx="18" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.7"/>
  <circle cx="82" cy="52" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb950">Looking for an internship</text>

  <!-- identity -->
  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1" fill="#ffffff">Parth Wakodikar</text>
  <text x="60" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#9db4ff">Generative AI, Backend and Full Stack Engineer</text>
  <text x="60" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">I build LLM applications, RAG pipelines and secure, scalable backends.</text>

  <line x1="60" y1="244" x2="660" y2="244" stroke="#30363d"/>

  <!-- stack -->
  <g font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#c9d1d9">
    <rect x="60"  y="260" width="106" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="113"   y="280" text-anchor="middle">TypeScript</text>
    <rect x="176" y="260" width="75"  height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="213.5" y="280" text-anchor="middle">Python</text>
    <rect x="261" y="260" width="83"  height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="302.5" y="280" text-anchor="middle">Next.js</text>
    <rect x="354" y="260" width="83"  height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="395.5" y="280" text-anchor="middle">Node.js</text>
    <rect x="447" y="260" width="106" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="500"   y="280" text-anchor="middle">PostgreSQL</text>
    <rect x="563" y="260" width="51"  height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="588.5" y="280" text-anchor="middle">RAG</text>
  </g>

  <!-- RAG pipeline panel -->
  <rect x="760" y="40" width="380" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="782" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9">How my RAG apps work</text>
  <line x1="760" y1="88" x2="1140" y2="88" stroke="#30363d"/>

  <line x1="800" y1="120" x2="800" y2="264" stroke="#30363d" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    <circle cx="800" cy="120" r="7" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="824" y="125" fill="#ffffff">Question</text>
    <text x="1118" y="125" text-anchor="end" fill="#8b949e" font-size="13">user input</text>

    <circle cx="800" cy="156" r="7" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="824" y="161" fill="#ffffff">Embed</text>
    <text x="1118" y="161" text-anchor="end" fill="#8b949e" font-size="13">text to vector</text>

    <circle cx="800" cy="192" r="7" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="824" y="197" fill="#ffffff">Retrieve</text>
    <text x="1118" y="197" text-anchor="end" fill="#8b949e" font-size="13">pgvector top-k</text>

    <circle cx="800" cy="228" r="7" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="824" y="233" fill="#ffffff">Generate</text>
    <text x="1118" y="233" text-anchor="end" fill="#8b949e" font-size="13">Gemini / Groq</text>

    <circle cx="800" cy="264" r="7" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="824" y="269" fill="#3fb950" font-weight="600">Answer</text>
    <text x="1118" y="269" text-anchor="end" fill="#8b949e" font-size="13">grounded in your docs</text>
  </g>

  <circle r="5" fill="#58a6ff">
    <animateMotion dur="4s" repeatCount="indefinite" path="M800 120 V264" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
