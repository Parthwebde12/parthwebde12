<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Parth Wakodikar - Generative AI, Backend and Full Stack Engineer. Core technologies: Python, TypeScript, React, Next.js, Node.js, PostgreSQL, and RAG.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#background)" rx="12"/>
  <rect width="1200" height="4" fill="url(#accent)" rx="2"/>

  <circle cx="80" cy="82" r="7" fill="#3fb950"/>
  <text x="100" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#3fb950">
    Looking for an internship
  </text>
  <circle cx="390" cy="82" r="5" fill="#8b949e"/>
  <text x="406" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">
    Pune, India
  </text>

  <!-- PW monogram -->
  <g transform="translate(1008 52)">
    <rect width="128" height="128" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <text x="64" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-4" fill="#ffffff">
      PW
    </text>
  </g>

  <text x="80" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Parth Wakodikar
  </text>
  <text x="82" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9db4ff">
    Generative AI · Backend · Full Stack
  </text>

  <text x="82" y="253" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">
    CORE TECH
  </text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">
    <rect x="82" y="266" width="88" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="126" y="290" text-anchor="middle">Python</text>

    <rect x="182" y="266" width="108" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="236" y="290" text-anchor="middle">TypeScript</text>

    <rect x="302" y="266" width="78" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="341" y="290" text-anchor="middle">React</text>

    <rect x="392" y="266" width="90" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="437" y="290" text-anchor="middle">Next.js</text>

    <rect x="494" y="266" width="90" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="539" y="290" text-anchor="middle">Node.js</text>

    <rect x="596" y="266" width="120" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="656" y="290" text-anchor="middle">PostgreSQL</text>

    <rect x="728" y="266" width="66" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="761" y="290" text-anchor="middle">RAG</text>
  </g>

  <line x1="82" y1="326" x2="1118" y2="326" stroke="#30363d"/>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#8b949e">
    "Build quietly. Ship boldly. Keep learning."
